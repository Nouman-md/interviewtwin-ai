# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interviewtwin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# File Upload Configuration
file.upload.max-size=10485760
file.upload.directory=${FILE_UPLOAD_DIRECTORY:uploads/resumes/}
file.upload.allowed-extensions=pdf,docx,doc

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model.name=${GEMINI_MODEL_NAME:gemini-3.6-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com}


# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# SMTP Authentication
spring.mail.properties.mail.smtp.auth=true

# TLS Configuration
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SMTP Connection Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://192.168.29.157:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept,Origin
cors.allow-credentials=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.interviewtwin=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Application Configuration
app.name=InterviewTwin AI
app.version=1.0.0
app.description=AI-Powered Placement Preparation Platform

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Cookie Security
# Local development uses HTTP, so Secure must remain false.
# Set APP_COOKIE_SECURE=true in production when using HTTPS.
app.cookie.secure=${APP_COOKIE_SECURE:false}